name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated Worker types
        run: npx --no-install wrangler types --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate Worker bundle
        run: npx --no-install wrangler deploy --dry-run

  deploy:
    name: Deploy
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://sandbox-compare.sync-cheap.workers.dev
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply D1 migrations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CI: true
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set the CLOUDFLARE_API_TOKEN Actions secret and CLOUDFLARE_ACCOUNT_ID Actions variable. See README.md."
            exit 1
          fi
          npm run db:remote
          npx --no-install wrangler deploy
      - name: Check public site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://sandbox-compare.sync-cheap.workers.dev/ -o /tmp/site.html
          node --input-type=module -e "import fs from 'node:fs'; if (!fs.readFileSync('/tmp/site.html', 'utf8').includes('Sandbox Index')) process.exit(1)"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://sandbox-compare.sync-cheap.workers.dev/api/dashboard -o /tmp/dashboard.json
          node --input-type=module -e "import fs from 'node:fs'; const data = JSON.parse(fs.readFileSync('/tmp/dashboard.json', 'utf8')); if (!Array.isArray(data.reports) || !data.providers.some(p => p.id === 'daytona' && p.connected)) process.exit(1)"
